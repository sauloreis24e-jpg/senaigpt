<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENAI-GPT</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- FUNDO ANIMADO -->
<canvas id="bgCanvas"></canvas>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-logo">
      <div class="login-avatar" id="loginAvatar">⚡</div>
    </div>
    <h2>SENAI-GPT</h2>
    <p>Entre com sua conta para continuar</p>

    <input type="text"     id="loginNome"  placeholder="Seu nome" />
    <div style="position:relative;">
      <input type="email"  id="loginEmail" placeholder="Email" oninput="validarEmail(this)" style="width:100%;padding-right:36px;" />
      <span id="emailOk" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;display:none;">✅</span>
    </div>

    <!-- Chave API — campo principal -->
    <div style="position:relative;">
      <input type="password" id="loginSenha" placeholder="Chave API (sk-ant-... ou Azure key)" style="width:100%;padding-right:40px;" />
      <button type="button" onclick="toggleSenha()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;color:var(--text2);font-size:16px;margin:0;" title="Ver chave">👁️</button>
    </div>

    <!-- foto de perfil opcional -->
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text2);font-size:13px;margin-top:-4px;">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Foto de perfil (opcional)
      <input type="file" accept="image/*" id="fotoPerfilInput" onchange="previewFotoPerfil(event)" hidden>
    </label>

    <button onclick="fazerLogin()">Entrar</button>

    <span class="modal-hint">
      💡 Use sua chave Azure OpenAI no campo "Chave API".<br>
      Sem chave? O app tentará conectar sem autenticação.
    </span>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-logo">⚡ SENAI-GPT</div>
      <button class="btn-new-chat" onclick="novaConversa()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Nova conversa
      </button>
    </div>
    <div class="sidebar-section-title">Histórico</div>
    <div id="historicoLista" class="historico-lista"></div>
    <div class="sidebar-bottom">
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">
          <img id="userAvatarImg" src="" alt="" style="display:none;width:100%;height:100%;border-radius:50%;object-fit:cover;">
          <span id="userAvatarLetter">S</span>
        </div>
        <div class="user-details">
          <div class="user-nome" id="userNome">Usuário</div>
          <div class="user-plan">SENAI-GPT</div>
        </div>
        <button class="btn-logout" onclick="fazerLogout()" title="Sair">↩</button>
      </div>
    </div>
  </aside>

  <!-- TOGGLE SIDEBAR -->
  <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
  </button>

  <!-- MAIN -->
  <main class="main" id="main">

    <!-- WELCOME -->
    <div class="welcome-screen" id="welcomeScreen">
      <div class="welcome-greeting" id="welcomeGreeting">Olá! 👋</div>
      <div class="welcome-sub">Como posso ajudar você hoje?</div>
      <div class="suggestion-chips">
        <button class="chip" onclick="sugerir('Me explique como funciona inteligência artificial')">🤖 O que é IA?</button>
        <button class="chip" onclick="sugerir('Me ajuda a escrever um texto criativo')">✍️ Escrever</button>
        <button class="chip" onclick="sugerir('Me ensina algo sobre programação em JavaScript')">💻 Código</button>
        <button class="chip" onclick="sugerir('Me conta uma curiosidade interessante sobre o universo')">🌟 Curiosidades</button>
      </div>
    </div>

    <!-- CHAT -->
    <div id="chatBox" class="chatbox hidden"></div>

    <!-- INPUT -->
    <div class="input-wrapper">
      <div class="input-box">

        <div id="imagePreview" class="image-preview hidden">
          <img id="previewImg" src="" alt="preview">
          <button onclick="removerImagem()" class="remove-img">✕</button>
        </div>

        <div class="input-row">
          <!-- Anexar imagem -->
          <label class="btn-attach" title="Anexar imagem">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <input type="file" id="fileInput" accept="image/*" onchange="selecionarImagem(event)" hidden>
          </label>

          <textarea id="input" placeholder="Como posso ajudar você hoje?" rows="1" oninput="autoResize(this)"></textarea>

          <!-- Microfone STT (transcreve no campo) -->
          <button class="btn-icon" id="btnMic" onclick="toggleMicrofone()" title="Ditado por voz">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
            </svg>
          </button>

          <!-- Conversa por voz completa -->
          <button class="btn-icon btn-voz-chat" id="btnVozChat" onclick="toggleModoVoz()" title="Conversar por voz com a SENAI-GPT">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <ellipse cx="12" cy="11" rx="4" ry="6"/>
              <path d="M2 11c0 5.52 4.48 10 10 10s10-4.48 10-10"/>
              <line x1="12" y1="21" x2="12" y2="24"/>
              <line x1="8" y1="24" x2="16" y2="24"/>
            </svg>
          </button>

          <!-- Enviar -->
          <button class="btn-send" onclick="enviarMensagem()">
            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
              <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
            </svg>
          </button>
        </div>

        <div class="input-footer">
          <select class="voz-select" id="vozGlobal" onchange="vozAtual = this.value">
            <option value="pt-BR-AntonioNeural">🧑 Antônio</option>
            <option value="pt-BR-ThalitaNeural">👩 Thalita</option>
          </select>
          <span class="input-hint">🎤 ditado · 🗣️ conversa por voz</span>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="script.js"></script>

<!-- Fundo animado -->
<script>
(function () {
    const canvas = document.getElementById("bgCanvas");
    const ctx    = canvas.getContext("2d");
    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    resize();
    addEventListener("resize", resize);

    const bolhas = Array.from({ length: 18 }, () => ({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: 80 + Math.random() * 220,
        vx: (Math.random() - .5) * .35,
        vy: (Math.random() - .5) * .35,
        hue: 195 + Math.random() * 50,
        alpha: .04 + Math.random() * .07
    }));

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        bolhas.forEach(b => {
            b.x += b.vx; b.y += b.vy;
            if (b.x < -b.r) b.x = canvas.width + b.r;
            if (b.x > canvas.width + b.r) b.x = -b.r;
            if (b.y < -b.r) b.y = canvas.height + b.r;
            if (b.y > canvas.height + b.r) b.y = -b.r;
            const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
            g.addColorStop(0, `hsla(${b.hue},85%,60%,${b.alpha})`);
            g.addColorStop(1, `hsla(${b.hue},85%,60%,0)`);
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.fillStyle = g;
            ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    draw();
})();
</script>

</body>
</html>
